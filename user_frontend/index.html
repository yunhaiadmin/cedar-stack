<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover：没有它，iOS 上 env(safe-area-inset-*) 恒为 0，
         底部导航坞与吸底按钮的“避开小白条”内边距会全部失效 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- 移动端浏览器工具栏跟随页面底色（不是品牌色），滚动时不会出现一条亮青色带 -->
    <meta name="theme-color" content="#0c0a09">
    <meta name="color-scheme" content="dark">
    <!-- 版本守卫：%BUILD_ID% 由 vite 构建期注入（vite.config.ts 的 buildId
         插件，CI 提交 SHA 优先、构建时间戳兜底）。运行时 utils/versionGuard
         读这份值与服务器上的壳比对，长开标签页跑旧构建时据此提示刷新。 -->
    <meta name="build-id" content="%BUILD_ID%">
    <meta name="description" content="Aetrix —— 自建影音媒体服务平台：在线播放、多服订阅与客户端接入。">
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.webmanifest">
    <!-- 保存到桌面（PWA / iOS 主屏幕）：图标与独立窗口形态 -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Aetrix">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- 标题衬线字：perf 优化（2026-10-13）移除了 Google Fonts 外链。
         原因：<link rel="stylesheet"> 是渲染阻塞的，fonts.googleapis.com
         在国内访问不稳定，会导致整页白屏等它。
         现在用系统字体栈（Songti SC / STSong / SimSun / serif），
         与 Noto Serif SC 同为宋体风格，首屏不再被外部字体卡住。 -->
    <title>Aetrix - 影音媒体服务平台</title>
    <style>
      /*
       * 首屏只留底色：开机转圈屏已按用户口径删除（2026-11-18「两个都删」），
       * JS 挂载前页面只有与应用一致的底色空白，不放任何加载元素；
       * 底色写在这里而不是等样式表，是为了样式表还没到时也不闪白底。
       * 白日模式：预套用脚本已写好 data-theme，底色同步换浅色。
       */
      html {
        background: #0c0a09;
        color-scheme: dark;
      }

      body {
        margin: 0;
      }

      html[data-theme='light'] {
        background: #f5f1ea;
        color-scheme: light;
      }

      html[data-theme='light'] #app-noscript {
        background: #f5f1ea;
        color: rgba(28, 25, 21, 0.72);
      }

      #app-noscript {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0c0a09;
        color: rgba(243, 237, 228, 0.68);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        text-align: center;
        padding: 24px;
      }

    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div id="app-noscript">
        <p>请启用 JavaScript 以使用本网站</p>
      </div>
    </noscript>
    <script>
      /*
       * 主题预套用：在样式表与 Vue 挂载前把 html[data-theme] 定好，避免首屏
       * 闪烁（FOUC）。口径与 src/composables/useTheme.ts 一致：
       * localStorage('aetrix-theme') = 'light' | 'dark' | 'system' | 缺省（深色）。
       * 缺省深色（用户决策 2026-10-11）：新用户首次进站默认深色；显式存了
       * 'system' 的老用户仍跟随系统。
       */
      (function () {
        try {
          var stored = localStorage.getItem('aetrix-theme');
          var theme;
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (stored === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light';
          } else {
            theme = 'dark';
          }
          if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f5f1ea');
          }
        } catch (e) { /* localStorage 不可用时跟默认深色 */ }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>能量老虎机</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#111);padding:10px;text-align:center;user-select:none;-webkit-user-select:none}
h1{font-size:17px;margin:2px 0 6px}
#demo{display:none;background:#e8a13a;color:#fff;border-radius:8px;font-size:12px;padding:2px 8px;margin-left:6px}
.pool{font-size:14px;color:var(--tg-theme-hint-color,#888);margin-bottom:8px}
.pool b{color:#e8a13a;font-size:17px}
.reels{display:flex;gap:8px;justify-content:center;margin:6px 0}
.reel{width:72px;height:84px;border:2px solid var(--tg-theme-hint-color,#bbb);border-radius:12px;background:var(--tg-theme-secondary-bg-color,#f2f2f2);font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center}
#msg{min-height:22px;font-size:15px;margin:6px 0}
.bets{display:flex;gap:8px;justify-content:center;margin:8px 0}
.bet{border:1px solid var(--tg-theme-hint-color,#bbb);background:transparent;color:inherit;border-radius:999px;padding:6px 16px;font-size:15px}
.bet.on{background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff);border-color:transparent}
#lever{width:100%;max-width:280px;padding:12px;font-size:17px;font-weight:700;border:0;border-radius:12px;background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff)}
#lever:disabled{opacity:.5}
.meta{display:flex;justify-content:space-between;max-width:280px;margin:10px auto 0;font-size:14px;color:var(--tg-theme-hint-color,#888)}
.meta b{color:var(--tg-theme-text-color,#111)}
.pay{font-size:11px;color:var(--tg-theme-hint-color,#999);margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<h1>🎰 能量老虎机<span id="demo">演示模式</span></h1>
<div class="pool">头奖池 <b id="pool">—</b> 能量</div>
<div class="reels"><div class="reel" id="r0">🍋</div><div class="reel" id="r1">🍇</div><div class="reel" id="r2">7</div></div>
<div id="msg">选注额，点拉杆</div>
<div class="bets"><button class="bet" data-b="5">5</button><button class="bet" data-b="10">10</button><button class="bet" data-b="20">20</button></div>
<button id="lever">拉 杆</button>
<div class="meta"><span>余额 <b id="bal">—</b></span><span>注额 <b id="curbet">20</b></span></div>
<div class="pay">777 ×10＋整池 · BAR 三连 ×10 · 葡萄/柠檬三连 ×5 · 双 7 ×1 返注<br>每注 5% 进头奖池 · 结果由机器人裁定，本地不作数</div>
<script>
"use strict";
var TW=window.TelegramWidget||null,LIVE=!!(TW&&typeof TW.request==="function");
var ORD=["bar","grape","lemon","seven"],GL={bar:"BAR",grape:"🍇",lemon:"🍋",seven:"7"};
var bet=20,bal=null,pool=null,spin=false,timer=null,stopped=[1,1,1],lastR=null;
var dBal=120,poolH=50000;
function $(i){return document.getElementById(i)}
function g(s){return GL[s]||s}
function say(t){$("msg").textContent=t}
function draw(){$("pool").textContent=pool===null?"—":pool;$("bal").textContent=bal===null?"—":bal;$("curbet").textContent=bet;
var bs=document.querySelectorAll(".bet");for(var i=0;i<bs.length;i++)bs[i].className="bet"+(+bs[i].getAttribute("data-b")===bet?" on":"")}
function readData(){if(!TW)return;
try{var c=JSON.parse(TW.chatData||"null");if(c){if(c.balance!=null)bal=c.balance;if(c.pool!=null)pool=c.pool}}catch(e){}
try{var p=JSON.parse(TW.publicData||"null");if(p&&p.pool!=null)pool=p.pool}catch(e){}}
try{var lb=+localStorage.getItem("slots.bet");if(lb===5||lb===10||lb===20)bet=lb}catch(e){}
if(LIVE){readData()}else{$("demo").style.display="inline-block";bal=dBal;pool=Math.floor(poolH/100)}
draw();
if(TW&&TW.onEvent){TW.onEvent("chatDataChanged",function(){readData();draw()});TW.onEvent("publicDataChanged",function(){readData();draw()})}
if(TW&&TW.ready)TW.ready();
var bets=document.querySelectorAll(".bet");
for(var i=0;i<bets.length;i++)(function(b){b.onclick=function(){if(spin)return;bet=+b.getAttribute("data-b");try{localStorage.setItem("slots.bet",bet)}catch(e){}draw()}})(bets[i]);
function cycle(){for(var i=0;i<3;i++)if(!stopped[i])$("r"+i).textContent=g(ORD[Math.floor(Math.random()*4)])}
function land(syms){for(var i=0;i<3;i++)(function(i){setTimeout(function(){stopped[i]=1;$("r"+i).textContent=g(syms[i]);if(i===2)finish()},300+i*280)})(i)}
function finish(){clearInterval(timer);spin=false;$("lever").disabled=false;
if(lastR.balance!=null)bal=lastR.balance;if(lastR.pool!=null)pool=lastR.pool;draw();
say(lastR.win>0?"🎉 中奖 +"+lastR.win+" 能量":"未中奖，再接再厉")}
function fail(t){clearInterval(timer);stopped=[1,1,1];spin=false;$("lever").disabled=false;say(t)}
function demoSpin(){
if(bet>dBal)return{error:1,msg:"能量不足（演示）"};
var v=Math.floor(Math.random()*64),s=[ORD[v>>4],ORD[(v>>2)&3],ORD[v&3]],base=0,jack=false,n=0,i;
if(s[0]==="seven"&&s[1]==="seven"&&s[2]==="seven"){base=bet*20;jack=true}
else if(s[0]===s[1]&&s[1]===s[2])base=bet*(s[0]==="bar"?10:5);
else{for(i=0;i<3;i++)if(s[i]==="seven")n++;if(n===2)base=bet}
dBal-=bet;poolH+=bet*5;var win=base;
if(jack){win+=Math.floor(poolH/100);poolH=10000}
dBal+=win;
return{symbols:s,win:win,balance:dBal,pool:Math.floor(poolH/100)}}
$("lever").onclick=function(){
if(spin)return;spin=true;$("lever").disabled=true;say("转动中…");
stopped=[0,0,0];timer=setInterval(cycle,70);
try{localStorage.setItem("slots.bet",bet)}catch(e){}
if(LIVE){
TW.request(JSON.stringify({a:"spin",bet:bet})).then(function(ans){
if(!ans||!ans.result){fail("机器人没有回结果");return}
var r;try{r=JSON.parse(ans.result)}catch(e){fail("机器人结果格式不对");return}
if(r.error){fail(r.msg||"机器人拒绝了这一局");return}
lastR=r;land(r.symbols||["lemon","lemon","seven"]);
},function(e){fail("请求失败："+(e&&e.code?e.code:"未知错误"))});
}else{
setTimeout(function(){var r=demoSpin();if(r.error){fail(r.msg);return}lastR=r;land(r.symbols)},350);
}};
</script>
</body>
</html>

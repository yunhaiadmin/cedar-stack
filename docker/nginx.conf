# 前端 nginx 配置：serve 双前端 + 反代后端 API。
# user_frontend → /usr/share/nginx/html/
# admin_frontend → /usr/share/nginx/html/admin/
# 后端地址由环境变量 BACKEND_HOST 决定（默认 aetrix-api:8000），
# 容器启动时 web-entrypoint.sh 会渲染占位符并生成最终配置。

# 上游后端：keepalive 复用 VPS→后端的 TCP 连接。
# 原来每个 /api/ 请求都用变量式 proxy_pass 新建一条 TCP（跨洋约 +140ms）；
# upstream keepalive 把建连摊掉。${BACKEND_HOST} 由 web-entrypoint.sh 在容器
# 启动时渲染（生产是 AWS 公网 IP，单机部署是 aetrix-api:8000）。
# 动态重解析：upstream 块内置 resolver + server 行的 resolve 参数
# （nginx 1.27.3+，运行镜像 1.30.7 支持），主机名按 valid=10s 周期向
# Docker 内置 DNS 重新解析——后端容器重建换 IP 后，web 不重启即可跟上
# 新 IP。旧行为是主机名只在 web 启动时解析一次，后端换 IP 后公网持续
# 502、必须手动重启 web 容器才恢复（2026-11-22～23 部署后多次复发）。
# zone 是 resolve 的硬性配套：upstream 不在共享内存里 nginx 直接 emerg
# 拒启（"resolving names at run time requires upstream ... to be in
# shared memory"，2026-11-23 生产机 scratch 实测）；同日实测后端同名
# 重建换 IP 后，未重启的 web 在 15s 后已把 /api/ 打到新 IP 并回 200。
upstream aetrix_backend {
    zone aetrix_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server ${BACKEND_HOST} resolve;
    keepalive 32;
}

# 测速端点并发限速区（http 级）：同一来源 IP 同时只许 2 条测速流，
# 防把 /speedtest/bin 当免费带宽刷（单流字节量另由后端 mb 钳制
# 1–100 MiB 兜底）。zone 名 speedtest_conn 与下方 location 内引用一致，
# 改名两处同步，否则 nginx -t emerg。
limit_conn_zone $binary_remote_addr zone=speedtest_conn:10m;

# 访问日志带耗时（C-08 可观测性，2026-11-28）：原先用默认 combined
# 格式、没有 $request_time，API 路由级延迟分位无从测起。本格式与
# combined 前缀逐字一致（既有日志消费方不受影响），尾部追加
# rt（请求总耗时）/uct/uht/urt（上游连接/响应头/响应耗时）/us
# （上游状态）。web-entrypoint.sh 只 envsubst ${BACKEND_HOST} 一个
# 变量，这些 $ 字段不会被渲染误伤。只加日志格式，不动任何
# location/上游/缓存规则。
log_format aetrix_timed '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" "$http_x_forwarded_for" '
    'rt=$request_time uct=$upstream_connect_time '
    'uht=$upstream_header_time urt=$upstream_response_time '
    'us=$upstream_status';

server {
    listen 80;
    access_log /dev/stdout aetrix_timed;
    # Docker 内置 DNS（变量式解析兜底；upstream 上游的动态重解析用其块内自带的 resolver）
    resolver 127.0.0.11 valid=10s;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Yamby 垫片（2026-11-24）：Yamby/2.0.5.5（Android）把 PlaybackInfo
    # 下发的绝对签名流地址当相对路径拼到它配置的服务器基址后面，实际
    # 请求变成 /embyhttps://cdn.aetrix.love/emby/Videos/<guid>/stream.mkv
    # ——不命中 /emby/ 前缀 location，掉进 location / 被 try_files 回退
    # 成 index.html（200 + HTML），客户端以为在播（还报 Sessions/
    # Playing）、实际黑屏（生产 access log 当日两例实证）。响应侧改不了
    # 它的拼法，这里在 server 级（location 选定前）把「/emby + 完整
    # 绝对 URL」还原成捕获到的真实路径，再走既有 /emby/ 代理。替换串
    # 不带 ? ：nginx 自动保留原查询串，签名参数（sign/exp/uid）原样
    # 到达后端、按原路径验签。 正则容忍斜杠合并：nginx 在 rewrite
    # 匹配前已按 merge_slashes（默认开）把 URI 里连续斜杠并成一个，
    # 实际待匹配形态是 /embyhttps:/<host>/... ——只写 :// 的话垫片
    # 永远不命中（2026-11-24 真 nginx 容器实测：:// 版畸形请求仍回
    # index.html，改 //? 后才到达上游）。
    rewrite ^/embyhttps?://?[^/]+(/.*)$ $1 break;

    # 客户端 IP 还原（A-068）：只信自有代理层网段（与后端
    # ratelimit._INFRA_PEER_NETS 同口径）发来的 X-Real-IP，用它改写
    # $remote_addr。双层生产：tls-bridge（宿主机）硬写的 X-Real-IP 经此
    # 还原为客户端 IP；单层部署：公网直连对端不在可信网段、自带的
    # X-Real-IP 一律忽略，$remote_addr 就是真直连 IP——伪造头进不了后端。
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 169.254.0.0/16;
    set_real_ip_from ::1/128;
    set_real_ip_from fc00::/7;
    set_real_ip_from fe80::/10;
    real_ip_header X-Real-IP;

    # gzip 压缩静态资源（2026-10-16 补 text/html：两个 index.html 之前是裸奔的）
    gzip on;
    gzip_types text/css text/html application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 后端 API：面板/用户端所有 /api/* 请求
    # ^~ 必留（A-067）：命中前缀后不再评估正则 location，否则文末静态
    # 资源正则会把 /api/*.svg（如库封面占位图 cover-placeholder.svg）抢去
    # 当静态文件找、回 404，占位图永远出不来。
    location ^~ /api/ {
        # A-124：后端库封面上传口上限 8MB（portal.py _LIBRARY_COVER_MAX_BYTES），
        # nginx 默认 client_max_body_size 只有 1MB，不覆盖则 1–8MB 的封面
        # 在 nginx 层先被默认 413 页截断、后端 8MB 校验够不着。取 10m 而非 8m：
        # multipart 体比文件本身大，10m 才能让后端校验去产生业务报错。
        client_max_body_size 10m;
        proxy_pass http://aetrix_backend;
        # keepalive 必须配 HTTP/1.1 + 空 Connection 头，否则复用不生效
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # X-Real-IP 发 realip 还原后的 $remote_addr（A-068）：server 段的
        # real_ip_header 已按可信网段把上层（tls-bridge）硬写的 X-Real-IP
        # 还原进 $remote_addr——双层下这里发出的仍是上层写好的客户端 IP，
        # 不是 docker 网关（2026-10-22 全站共用限流桶 429 的教训不复现）；
        # 单层下对端不可信、自带 X-Real-IP 被 realip 忽略，发的就是真
        # 直连 IP，伪造头进不了后端（后端取 IP 口径见 backend/ratelimit.py）。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    # WebSocket 长连：/ws/{user_id}（通知推送＋一起看信令，见
    # backend/websocket.py）。此前没有这条 location，/ws/ 请求掉进
    # location / 被 try_files 回退成 index.html（200 + HTML），浏览器
    # WS 握手拿不到 101，一起看永远建不了房（2026-11-26 用户实报：
    # 生产日志 32 小时内 /ws/ 仅 1 次 200、101 为 0；同窗口直连后端
    # 握手 101、建房/入房/房主独控全通，病灶只在这一层）。WS 必须走
    # HTTP/1.1 并透传 Upgrade/Connection；长连读/写超时放长（心跳由
    # 客户端 ping 维持），不许被默认超时掐断。
    location /ws/ {
        proxy_pass http://aetrix_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # X-Real-IP 发 realip 还原后的 $remote_addr（同 /api/ 处 A-068 说明）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Emby 客户端协议路径：/emby/* 与裸根 /System/* 等
    location /emby/ {
        proxy_pass http://aetrix_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # X-Real-IP 发 realip 还原后的 $remote_addr（同 /api/ 处 A-068 说明）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        # 流媒体需要大缓冲关闭，直接透传
        proxy_buffering off;
    }

    # 线路测速字节流：后端 /speedtest/bin（免鉴权、响应自带 CORS *，
    # 前端裸 fetch 逐字节计量）。测速要的是真实下行：关缓冲让字节
    # 直达、关 gzip 防压缩失真（octet-stream 本不在 gzip_types 内，
    # 这里写死防日后有人扩 gzip_types 把它带进来）；limit_conn 限
    # 同一 IP 并发，防滥用。此前没有这条 location，请求掉进
    # location / 被 try_files 回退成 index.html（200 + text/html），
    # 测速页拿到 HTML 必然报「连接失败」（2026-11-24 用户实报）。
    location = /speedtest/bin {
        limit_conn speedtest_conn 2;
        proxy_pass http://aetrix_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        gzip off;
    }

    # Emby 客户端协议路径（裸根形式）：部分客户端（Reflix、WWPlayer、Hills
    # 等）按真 Emby 服务器习惯把服务器地址当根，直接请求 /Users/...、
    # /System/... 不带 /emby 前缀。后端网关对两种形式都注册了路由，但此前
    # 裸根路径在 nginx 层掉进 SPA 的 location /：GET 被 try_files 回退成
    # index.html（客户端拿 HTML 当 JSON 解析失败）、POST 直接 405（静态
    # 文件不许 POST），登录请求根本到不了鉴权层（2026-11-23 Reflix 真机
    # 实证：POST /Users/AuthenticateByName → 405、login_logs 无记录）。
    # 段名单逐段来自网关路由表（emby_router + search + preflight，含
    # install_* 替换后形态），增删段先改后端路由、再同步这里与守卫测试。
    # 隔离关系：SPA 路由全小写（/library、/game、/login…），nginx location
    # 匹配大小写敏感，段名靠大小写与之天然隔离；正则锚定段边界（段名后
    # 必须是 / 或结尾），/UsersX 这类路径不会误入。本块必须排在文件末尾的
    # 静态资源正则 location 之前——正则 location 按文件顺序取首个命中，
    # 带文件式后缀的 API 路径不许被静态缓存块抢走。
    # 有意不放行（后端裸根无对应路由，放行也只是到后端 404，不如实列明）：
    # 小写 system/branding（仅 /emby 下有小写别名）、Devices（网关未实现）、
    # api（裸根 /api/danmu 等已由上面的 /api/ 块同上游覆盖）。
    location ~ ^/(Activity|Branding|DisplayPreferences|EpisodeGroups|Genres|Items|Library|LiveTV|Localization|MediaBackup|Movies|OfficialRatings|Persons|PlayPreflight|Plugins|ScheduledTasks|Search|Sessions|Shows|Studios|System|Tags|Trailers|UnifiedSearch|UserViews|Users|Videos|Web|Years|quickconnect|videos|swagger\.json)(/.*)?$ {
        proxy_pass http://aetrix_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # X-Real-IP 发 realip 还原后的 $remote_addr（同 /api/ 处 A-068 说明）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        # 流媒体需要大缓冲关闭，直接透传
        proxy_buffering off;
    }

    # 安全响应头（F7）：前端页面此前一个都没设，可被 iframe 嵌套（点击劫持）；
    # API 侧由后端中间件下发同口径头（X-Frame-Options: DENY 等），页面侧在这里补齐。
    # 写法纪律：nginx 的 add_header 不继承合并——某 location 里只要有一条
    # add_header，上层（server）的 add_header 全部失效，所以不用 server 级一处
    # 统加（那样带 add_header 的 location 会漏，且 /api/ 反代响应会与后端自带头
    # 重复成双份），而是逐个静态 location 各自写全五条，always 保证错误响应也带。
    # CSP 只加 frame-ancestors 一条：全量 CSP（script-src 等）可能打坏 SPA 的
    # 内联脚本与外源加载，风险另行评估；frame-ancestors 'none' 与 X-Frame-Options
    # DENY 同义、互为新老浏览器兜底，不限制任何资源加载。

    # 管理后台：/admin/* → admin 前端 dist
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri $uri/ /admin/index.html;
    }
    location = /admin {
        return 301 /admin/;
    }

    # SPA 壳（两个 index.html）禁止缓存：壳里引用的是带内容哈希的 chunk，
    # 发版后旧 chunk 即不存在；此前壳没给任何缓存头，浏览器启发式缓存住旧壳，
    # 再打开时引用全 404、整页白屏（2026-11-13 发版后实证）。壳很小，每次回源
    # 校验即可（带 Last-Modified，未变回 304）；带哈希的静态资源仍走下面 1y
    # immutable。try_files 回退与目录 index 都会内部重定向到这两个确切路径，
    # 命中本块。
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
    location = /admin/index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # wasm 解码器（批 2 自托管，见 tools/softdecode/README.md）：产物内容
    # 随版本钉死，1y immutable；缺失的 wasm 必须 404，不许回退到
    # index.html（否则播放器拿到 HTML 当 wasm 会静默失败）。
    location ^~ /wasm/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # 用户端：SPA，全部回退到 index.html
    location / {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长期缓存（Vite 文件名带内容哈希，1y 安全；index.html 不走这条）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
}

